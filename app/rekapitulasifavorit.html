<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="../style/bootstrap-theme.css">
<link rel="stylesheet" href="../style/kategori.css">
  <link rel="stylesheet" href="../style/dashboard-return.css">
  <title>Rekapitulasi Favorit — MASAKin</title>
</head>
<body>
  <nav class="site-navbar navbar navbar-expand-lg" aria-label="Navigasi utama">
    <a class="site-brand" href="index.html"><img src="../assets/masakin-logo.jpeg" alt=""> <span>MASAKin</span></a>
    <div class="site-nav-links nav flex-column"><a href="index.html">Dashboard</a><a href="kelola-resep.html">Resep</a><a href="filterbahan.html">Cari resep</a><a href="favorit.html">Favorit</a><a href="daftar-belanja.html">Daftar belanja</a><a href="laporan.html">Laporan</a><a href="rekapitulasibahan.html">Rekap bahan</a><a href="rekapitulasikategori.html">Rekap kategori</a><a href="rekapitulasifavorit.html" aria-current="page">Rekap favorit</a><a href="profil.html">Profil</a></div>
  </nav>

  <main class="manager container py-4">
    <header class="page-header">
      <span class="badge">MASAKin</span>
      <h1>Rekapitulasi Favorit</h1>
      <p class="description">Ringkasan resep yang kamu tandai sebagai favorit dan data paling sering dipilih.</p>
    </header>

    <section class="card panel" aria-labelledby="favorites-summary-heading">
      <div class="section-heading">
        <div>
          <h2 id="favorites-summary-heading">Ringkasan</h2>
          <p id="summary-updated" aria-live="polite"></p>
        </div>
      </div>
      <div id="summary-cards" class="summary-cards row g-3" aria-live="polite"></div>
    </section>

    <section class="card panel" aria-labelledby="favorite-detail-heading">
      <div class="section-heading">
        <div>
          <h2 id="favorite-detail-heading">Daftar resep favorit</h2>
          <p>Semua resep yang ditandai sebagai favorit.</p>
        </div>
        <span id="favorite-total" class="favorite-count" aria-live="polite"></span>
      </div>

      <form id="favorite-search-form" class="filter-form row g-3">
        <label for="favorite-search">Cari resep favorit</label>
        <input class="form-control" id="favorite-search" type="search" placeholder="Ketik nama resep atau kategori">
        <div class="form-actions d-flex flex-wrap gap-2">
          <button id="clear-search" class="btn btn-outline-secondary secondary" type="button">Reset</button>
        </div>
      </form>

      <p id="result-status" class="result-count" aria-live="polite"></p>
      <ul id="favorite-list" class="recipe-list row g-3"></ul>
    </section>
  </main>

  <script src="../script/sample-data.js" defer></script>
  <script src="../script/rekapitulasifavorit.js" defer></script>
  <script src="../script/recipe-detail.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../script/dashboard-return.js"></script>
</body>
</html>
