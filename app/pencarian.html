<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../style/kategori.css">
  <link rel="stylesheet" href="../style/dashboard-return.css">
  <title>Pencarian Resep</title>
</head>
<body>
  <nav class="site-navbar" aria-label="Navigasi utama">
    <a class="site-brand" href="index.html"><img src="../assets/masakin-logo.jpeg" alt=""> <span>MASAKin</span></a>
    <div class="site-nav-links"><a href="index.html">Dashboard</a><a href="kelola-resep.html">Resep</a><a href="filterbahan.html">Cari resep</a><a href="favorit.html">Favorit</a><a href="daftar-belanja.html">Daftar belanja</a><a href="laporan.html">Laporan</a><a href="rekapitulasibahan.html">Rekap bahan</a><a href="rekapitulasikategori.html">Rekap kategori</a><a href="rekapitulasifavorit.html">Rekap favorit</a><a href="profil.html">Profil</a></div>
  </nav>
  <main class="manager">
    <header class="page-header">
      <span class="badge">MASAKin</span>
      <h1>Pencarian Resep</h1>
      <p class="description">Temukan resep berdasarkan nama, kategori, atau deskripsinya.</p>
      <a class="back-link" href="kelola-resep.html">← Kembali ke pengelolaan resep</a>
    </header>

    <section class="card panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Pencarian Resep</h2>
      <form id="search-form" class="filter-form">
        <label for="search-query">Nama atau deskripsi resep</label>
        <input class="form-control" id="search-query" name="query" type="search"
          placeholder="Contoh: soto, pedas, santan">

        <label for="search-category">Kategori</label>
        <select class="form-select" id="search-category" name="category">
          <option value="">Semua kategori</option>
        </select>

        <div class="form-actions">
          <button type="submit">Cari resep</button>
          <button id="clear-search" class="btn btn-outline-secondary secondary" type="button">Reset</button>
        </div>
      </form>

      <p id="search-status" class="result-count" aria-live="polite"></p>
      <ul id="search-results" class="recipe-list"></ul>
    </section>
  </main>
  <script src="../script/sample-data.js" defer></script>
  <script src="../script/pencarian.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="../script/dashboard-return.js"></script>
</body>
</html>
