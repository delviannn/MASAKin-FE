<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style/kategori.css">
  <title>Rekapitulasi Kategori dan Resep — MASAKin</title>
</head>
<body>
  <nav class="site-navbar" aria-label="Navigasi utama">
    <a class="site-brand" href="index.html"><img src="../assets/masakin-logo.jpeg" alt=""> <span>MASAKin</span></a>
    <div class="site-nav-links"><a href="index.html">Dashboard</a><a href="kelola-resep.html">Resep</a><a href="filterbahan.html">Cari resep</a><a href="favorit.html">Favorit</a><a href="daftar-belanja.html">Daftar belanja</a><a href="laporan.html">Laporan</a><a href="rekapitulasibahan.html">Rekap bahan</a><a href="rekapitulasikategori.html" aria-current="page">Rekap kategori</a><a href="rekapitulasifavorit.html">Rekap favorit</a><a href="profil.html">Profil</a></div>
  </nav>
  <main class="manager">
    <header class="page-header">
      <span class="badge">MASAKin</span>
      <h1>Rekapitulasi Kategori dan Resep</h1>
      <p class="description">Lihat jumlah kategori, jumlah resep, dan resep yang termasuk dalam setiap kategori.</p>
    </header>

    <section class="panel" aria-labelledby="category-summary-heading">
      <div class="section-heading">
        <div>
          <h2 id="category-summary-heading">Ringkasan</h2>
          <p id="summary-updated" aria-live="polite"></p>
        </div>
      </div>
      <div id="summary-cards" class="summary-cards" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="details-heading">
      <h2 id="details-heading">Detail Kategori dan Resep</h2>
      <form id="category-search-form" class="filter-form">
        <label for="category-search">Cari kategori atau nama resep</label>
        <input id="category-search" type="search" placeholder="Ketik nama kategori atau resep">
        <div class="form-actions">
          <button id="clear-search" class="secondary" type="button">Reset</button>
        </div>
      </form>
      <p id="result-status" class="result-count" aria-live="polite"></p>
      <div id="category-recipe-list" class="category-recipe-list"></div>
    </section>
  </main>
  <script src="../script/sample-data.js" defer></script>
  <script src="../script/rekapitulasikategori.js" defer></script>
</body>
</html>
