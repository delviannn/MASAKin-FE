<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="kategori.css">
  <title>Pencarian Resep</title>
</head>
<body>
  <nav class="site-navbar" aria-label="Navigasi utama">
    <a class="site-brand" href="index.html"><img src="assets/masakin-logo.jpeg" alt=""> <span>MASAKin</span></a>
    <div class="site-nav-links">
      <a href="index.html">Beranda</a>
      <a href="kelola-resep.html">Resep</a>
      <a href="kategori.html">Kategori</a>
      <a href="filterbahan.html" aria-current="page">Cari resep</a>
      <a href="langkahresep.html">Langkah</a>
      <a href="favorit.html">Favorit</a>
      <a href="rekapitulasibahan.html">Rekap bahan</a>
      <a href="rekapitulasikategori.html">Rekap kategori</a>
    </div>
  </nav>
  <main class="manager">
    <header class="page-header">
      <span class="badge">MASAKin</span>
      <h1>Pencarian Resep</h1>
      <p class="description">Temukan resep berdasarkan nama, kategori, atau deskripsinya.</p>
      <a class="back-link" href="kategori.html">← Kembali ke pengelolaan resep</a>
    </header>

    <section class="panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Pencarian Resep</h2>
      <form id="search-form" class="filter-form">
        <label for="search-query">Nama atau deskripsi resep</label>
        <input id="search-query" name="query" type="search"
          placeholder="Contoh: soto, pedas, santan">

        <label for="search-category">Kategori</label>
        <select id="search-category" name="category">
          <option value="">Semua kategori</option>
        </select>

        <div class="form-actions">
          <button type="submit">Cari resep</button>
          <button id="clear-search" class="secondary" type="button">Reset</button>
        </div>
      </form>

      <p id="search-status" class="result-count" aria-live="polite"></p>
      <ul id="search-results" class="recipe-list"></ul>
    </section>
  </main>
  <script src="sample-data.js" defer></script>
  <script src="pencarian.js" defer></script>
</body>
</html>
